[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrt-runtime"
version = "0.1.0"
description = "A local runtime for background coding-agent sessions, with a CLI and an MCP server"
requires-python = ">=3.12"
dependencies = [
    "agentrt-sdk",
    "agentrt-server",
    # bootstrap.py imports agentrt.tools.preset.default to register the terminal,
    # file editor and task tracker. Undeclared until a clean install went looking
    # for it: every workspace member is present in a development checkout, so
    # nothing here failed until the package was installed on its own.
    "agentrt-tools",
    # server_launch registers DockerWorkspace so a container-backed session can
    # be asked for over the REST API. The import is optional at runtime, but a
    # normal install should be able to use it.
    "agentrt-workspace",
    "httpx>=0.28",
    # Pinned below 2: mcp 2.x renamed FastMCP to MCPServer, which
    # agentrt.runtime.mcp_server imports. A bare ">=1.28" resolves to 2.x on a
    # clean install and the MCP server fails to start. packages/uv.lock already
    # pins 1.28.1; this makes a standalone `uv tool install` agree with it.
    "mcp>=1.28,<2",
    # The inspect preset accepts regular expressions from an untrusted worker.
    # Python's stdlib engine has no timeout; regex provides a hard per-match
    # deadline so a catastrophic pattern cannot stall the daemon.
    "regex>=2025.9.18",
]

[tool.setuptools.packages.find]
include = ["agentrt.runtime*"]
namespaces = true

[project.scripts]
agentrt = "agentrt.runtime.cli:main"
agentrt-mcp = "agentrt.runtime.mcp_server:main"
