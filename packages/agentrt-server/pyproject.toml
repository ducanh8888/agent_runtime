[project]
name = "agentrt-server"
version = "1.44.1"
description = "Agentrt Agent Server - REST/WebSocket interface for Agentrt AI Agent"

requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.19",
  "alembic>=1.13",
  "docker>=7.1,<8",
  "fastapi>=0.104",
  "agentrt-sdk",
  "openai>=2.33.0,<3",
  "pydantic>=2",
  "sqlalchemy>=2",
  "uvicorn>=0.31.1",
  "websockets>=12",
  "wsproto>=1.2.0",
]

[project.optional-dependencies]
# Product-analytics exporter. Optional on purpose: the core server and every
# library/headless consumer must be able to run without a vendor analytics SDK
# on the import path. Pinned to the major already resolved in uv.lock (6.7.7,
# via browser-use) so installing the extra cannot force a resolver conflict.
posthog = ["posthog>=6,<7"]

[project.urls]
Source = "https://github.com/OpenHands/software-agent-sdk"
Homepage = "https://github.com/OpenHands/software-agent-sdk"
Documentation = "https://docs.openhands.dev/sdk"
"Bug Tracker" = "https://github.com/OpenHands/software-agent-sdk/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["agentrt.agent_server*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
# Include Docker-related files and VSCode extensions
"agentrt.agent_server" = [
  "docker/Dockerfile",
  "docker/wallpaper.svg",
  "vscode_extensions/**/*.json",
  "vscode_extensions/**/*.js",
]

[project.scripts]
agent-server = "agentrt.agent_server.__main__:main"
